<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: #2c2416;
    font-family: "Microsoft YaHei", sans-serif; user-select: none;
  }
  h1 { color: #d4a85c; margin-bottom: 8px; font-size: 28px; letter-spacing: 4px; }
  .mode-tabs { display: flex; margin-bottom: 12px; border-radius: 6px; overflow: hidden; }
  .mode-tab {
    padding: 6px 20px; font-size: 14px; border: 1px solid #d4a85c;
    background: transparent; color: #d4a85c; cursor: pointer; transition: all .2s;
  }
  .mode-tab:first-child { border-radius: 6px 0 0 6px; }
  .mode-tab:last-child { border-radius: 0 6px 6px 0; }
  .mode-tab.active { background: #d4a85c; color: #2c2416; font-weight: bold; }
  .online-panel {
    display: none; flex-direction: column; align-items: center; gap: 10px;
    margin-bottom: 12px; padding: 16px 24px; background: #3a3020;
    border-radius: 8px; border: 1px solid #5a4a30; min-width: 320px;
  }
  .online-panel.show { display: flex; }
  .online-panel .row { display: flex; gap: 8px; align-items: center; }
  .online-panel input {
    width: 140px; padding: 8px 12px; font-size: 16px; border-radius: 4px;
    border: 1px solid #5a4a30; background: #2c2416; color: #d4a85c;
    text-align: center; letter-spacing: 4px; outline: none;
  }
  .online-panel input:focus { border-color: #d4a85c; }
  .online-panel .status-text { color: #aaa; font-size: 14px; min-height: 20px; }
  .online-panel .room-id { color: #d4a85c; font-size: 32px; letter-spacing: 8px; font-weight: bold; }
  .btn-copy {
    padding: 6px 14px; font-size: 13px; letter-spacing: 1px;
    background: #5a4a30; color: #d4a85c; border: 1px solid #d4a85c;
    border-radius: 4px; cursor: pointer; transition: all .2s;
  }
  .btn-copy:hover { background: #6a5a40; }
  .btn-copy.copied { background: #4a8; color: #fff; border-color: #4a8; }
  .info { display: flex; align-items: center; gap: 32px; margin-bottom: 12px; }
  .turn { display: flex; align-items: center; gap: 8px; color: #ccc; font-size: 18px; }
  .stone { width: 24px; height: 24px; border-radius: 50%; display: inline-block; }
  .black-stone { background: radial-gradient(circle at 35% 35%, #555, #111 60%, #000); }
  .white-stone { background: radial-gradient(circle at 35% 35%, #fff, #ccc 60%, #999); }
  canvas { border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  .buttons { display: flex; gap: 16px; margin-top: 16px; }
  button {
    padding: 10px 40px; font-size: 16px; border: none; border-radius: 6px;
    background: #d4a85c; color: #2c2416; cursor: pointer; font-weight: bold;
    letter-spacing: 2px; transition: background .2s;
  }
  button:hover { background: #e6c06a; }
  button:disabled { background: #666; color: #999; cursor: not-allowed; }
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .dialog {
    background: #3a3020; padding: 40px 60px; border-radius: 12px;
    text-align: center; color: #d4a85c; font-size: 20px;
    box-shadow: 0 0 60px rgba(0,0,0,.7);
  }
  .dialog .btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
</style>
</head>
<body>

<h1>五 子 棋</h1>

<div class="mode-tabs">
  <button class="mode-tab active" onclick="switchMode('local')">本地对战</button>
  <button class="mode-tab" onclick="switchMode('online')">联网对战</button>
</div>

<div class="online-panel" id="onlinePanel">
  <div style="color:#888;font-size:13px;text-align:center;margin-bottom:4px">
    ⚡ 无需服务器，通过公共中继直接连接<br>
    创建房间 → 把房间号发给朋友 → 双方即可对战
  </div>
  <div>
    <button onclick="createRoom()">创建房间</button>
  </div>
  <div class="row">
    <input type="text" id="roomInput" maxlength="4" placeholder="输入房间号"
           oninput="this.value=this.value.replace(/\D/g,'')">
    <button onclick="joinRoom()">加入房间</button>
  </div>

  <div id="roomInfo" style="display:none;flex-direction:column;align-items:center;gap:8px">
    <div style="color:#aaa;font-size:13px">房间号（发给朋友）</div>
    <div class="room-id" id="roomIdDisplay"></div>
    <div style="color:#888;font-size:12px" id="waitingHint">等待对手加入...</div>
    <div style="color:#777;font-size:12px;max-width:280px;text-align:center">
      让朋友打开同一页面，进入"联网对战"，<br>输入此房间号，点击"加入房间"
    </div>
    <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 复制邀请链接</button>
  </div>

  <div class="status-text" id="statusText">未连接</div>
</div>

<div class="info">
  <div class="turn" id="turnDisplay">
    <span class="stone black-stone"></span> 黑棋回合
  </div>
  <span style="color:#888">｜</span>
  <span style="color:#aaa" id="stepCount">第 0 手</span>
</div>

<canvas id="board"></canvas>

<div class="buttons" id="actionButtons">
  <button onclick="onUndo()" id="undoBtn">悔棋</button>
  <button onclick="resetGame()">重新开始</button>
</div>

<!-- 胜利弹窗 -->
<div class="overlay" id="winnerOverlay">
  <div class="dialog">
    <div id="winnerText"></div>
    <div class="btns">
      <button onclick="onUndo()">悔棋</button>
      <button onclick="resetGame()">再来一局</button>
    </div>
  </div>
</div>

<!-- 悔棋确认弹窗 -->
<div class="overlay" id="undoOverlay">
  <div class="dialog">
    <div>对方请求悔棋，是否同意？</div>
    <div class="btns">
      <button onclick="answerUndo(true)">同意</button>
      <button onclick="answerUndo(false)">拒绝</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
// ============ 常量 ============
const SIZE = 15, CELL = 40, PADDING = 30, RADIUS = 17;

// MQTT Broker，国内节点优先 — 同一房间用确定性算法选同一台
const BROKERS = [
  { url: 'wss://broker-cn.emqx.io:8084/mqtt', name: 'EMQX中国' },
  { url: 'wss://broker.emqx.io:8084/mqtt',    name: 'EMQX全球' },
  { url: 'wss://mqtt.eclipseprojects.io:443/mqtt', name: 'Eclipse' },
];
	function pickBroker(rid) { return (parseInt(rid) * 7) % BROKERS.length; }

// ============ DOM 引用 ============
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = PADDING * 2 + CELL * (SIZE - 1);
canvas.height = PADDING * 2 + CELL * (SIZE - 1);

// ============ 游戏状态 ============
let board = Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));
let currentPlayer = 1;
let gameOver = false;
let stepCount = 0;
let moveHistory = [];
let lastMove = null;

// ============ 联网状态 ============
let mode = 'local';
let myColor = null;
let mqttClient = null;
let roomId = null;
let waitingUndoAnswer = false; handshakeDone = false; connectRetry = 0; brokerIdx = -1;
let brokerIdx = -1, connectRetry = 0, handshakeDone = false;

// ============ 棋盘绘制 ============
function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#d4a85c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING + i * CELL);
    ctx.lineTo(PADDING + (SIZE - 1) * CELL, PADDING + i * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(PADDING + i * CELL, PADDING);
    ctx.lineTo(PADDING + i * CELL, PADDING + (SIZE - 1) * CELL);
    ctx.stroke();
  }
  const stars = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
  for (const [r, c] of stars) {
    ctx.beginPath();
    ctx.arc(PADDING + c * CELL, PADDING + r * CELL, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#333';
    ctx.fill();
  }
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) continue;
      const x = PADDING + c * CELL, y = PADDING + r * CELL;
      if (board[r][c] === 1) {
        const g = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, RADIUS);
        g.addColorStop(0, '#555'); g.addColorStop(1, '#000');
        ctx.fillStyle = g;
      } else {
        const g = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, RADIUS);
        g.addColorStop(0, '#fff'); g.addColorStop(1, '#999');
        ctx.fillStyle = g;
      }
      ctx.beginPath(); ctx.arc(x, y, RADIUS, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  if (lastMove) {
    const x = PADDING + lastMove.c * CELL, y = PADDING + lastMove.r * CELL;
    ctx.fillStyle = '#e00';
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  }
}

// ============ 胜负检测 ============
function checkWin(r, c, player) {
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    let count = 1;
    for (let i = 1; i < 5; i++) {
      const nr = r + dr * i, nc = c + dc * i;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || board[nr][nc] !== player) break;
      count++;
    }
    for (let i = 1; i < 5; i++) {
      const nr = r - dr * i, nc = c - dc * i;
      if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || board[nr][nc] !== player) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

// ============ 回合显示 ============
function updateTurn() {
  const d = document.getElementById('turnDisplay');
  const c = document.getElementById('stepCount');
  const myTurn = (currentPlayer === 1 && myColor === 'black') || (currentPlayer === 2 && myColor === 'white');
  if (gameOver) {
    d.innerHTML = '<span style="color:#d4a85c">游戏结束</span>';
  } else if (mode === 'online' && !myTurn) {
    d.innerHTML = '<span class="stone ' + (currentPlayer === 1 ? 'black-stone' : 'white-stone') + '"></span> 对方回合';
  } else {
    d.innerHTML = '<span class="stone ' + (currentPlayer === 1 ? 'black-stone' : 'white-stone') + '"></span> '
      + (currentPlayer === 1 ? '黑棋回合' : '白棋回合');
  }
  c.textContent = '第 ' + stepCount + ' 手';
}

// ============ 权限检查 ============
function canIPlace() {
  if (gameOver) return false;
  if (mode === "local") return true;
  if (!handshakeDone) return false;
  if (myColor === 'black' && currentPlayer === 1) return true;
  if (myColor === 'white' && currentPlayer === 2) return true;
  return false;
}

// ============ 落子 ============
function placeStone(r, c, player) {
  board[r][c] = player;
  lastMove = { r, c };
  moveHistory.push({ r, c, player });
  stepCount++;
  drawBoard();

  if (checkWin(r, c, player)) {
    gameOver = true;
    document.getElementById('winnerText').textContent = '🎉 ' + (player === 1 ? '黑棋' : '白棋') + '获胜！';
    document.getElementById('winnerOverlay').classList.add('show');
    if (mode === 'online') publish({ type: 'win' });
    updateTurn();
    return;
  }
  if (stepCount === SIZE * SIZE) {
    gameOver = true;
    document.getElementById('winnerText').textContent = '🤝 平局！';
    document.getElementById('winnerOverlay').classList.add('show');
    return;
  }
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  updateTurn();
}

// ============ 棋盘点击 ============
canvas.addEventListener('click', (e) => {
  if (!canIPlace()) return;
  const rect = canvas.getBoundingClientRect();
  const c = Math.round((e.clientX - rect.left - PADDING) / CELL);
  const r = Math.round((e.clientY - rect.top - PADDING) / CELL);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
  if (board[r][c] !== 0) return;

  if (mode === 'local') {
    placeStone(r, c, currentPlayer);
  } else {
    publish({ type: 'move', r, c, player: currentPlayer });
    placeStone(r, c, currentPlayer);
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!canIPlace()) { canvas.style.cursor = 'default'; return; }
  const rect = canvas.getBoundingClientRect();
  const c = Math.round((e.clientX - rect.left - PADDING) / CELL);
  const r = Math.round((e.clientY - rect.top - PADDING) / CELL);
  canvas.style.cursor = (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === 0) ? 'pointer' : 'default';
});

// ============ 悔棋 ============
function onUndo() {
  if (mode === 'local') {
    undoLocal();
  } else if (mode === 'online' && !gameOver) {
    publish({ type: 'undo_req' });
    waitingUndoAnswer = true;
    setStatus('等待对方确认悔棋...');
  }
}

function answerUndo(accepted) {
  document.getElementById('undoOverlay').classList.remove('show');
  publish({ type: 'undo_rsp', accepted });
  if (accepted) undoLocal();
}

function undoLocal() {
  if (moveHistory.length === 0) return;
  if (gameOver) {
    gameOver = false;
    document.getElementById('winnerOverlay').classList.remove('show');
  }
  const last = moveHistory.pop();
  board[last.r][last.c] = 0;
  stepCount--;
  currentPlayer = last.player;
  lastMove = moveHistory.length > 0 ? moveHistory[moveHistory.length - 1] : null;
  drawBoard();
  updateTurn();
}

function resetGame() {
  board = Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));
  currentPlayer = 1;
  gameOver = false;
  stepCount = 0;
  lastMove = null;
  moveHistory = [];
  waitingUndoAnswer = false; handshakeDone = false; connectRetry = 0; brokerIdx = -1;
  document.getElementById('winnerOverlay').classList.remove('show');
  document.getElementById('undoOverlay').classList.remove('show');
  drawBoard();
  updateTurn();
  if (mode === 'online' && roomId) {
    setStatus('对局中 · 房间号: ' + roomId);
  }
}

// ============ 模式切换 ============
function switchMode(newMode) {
  if (mode === newMode) return;
  mode = newMode;
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && newMode === 'local') || (i === 1 && newMode === 'online'));
  });
  document.getElementById('onlinePanel').classList.toggle('show', newMode === 'online');

  if (mqttClient) { mqttClient.end(true); mqttClient = null; }
  roomId = null;
  myColor = null;
  waitingUndoAnswer = false; handshakeDone = false; connectRetry = 0; brokerIdx = -1;
  document.getElementById('roomInfo').style.display = 'none';
  document.getElementById('roomIdDisplay').textContent = '';
  document.getElementById('undoOverlay').classList.remove('show');
  document.getElementById('statusText').textContent = '未连接';
  document.getElementById('roomInput').value = '';
  resetGame();
}

// ============ 联网通信（确定性 Broker + 握手确认） ============
function setStatus(text, isGood) {
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.style.color = isGood === false ? '#e55' : isGood ? '#8c8' : '#aaa';
}

function myTopic()  { return 'gomoku/' + roomId + '/' + (myColor === 'black' ? 'host' : 'guest'); }
function peerTopic() { return 'gomoku/' + roomId + '/' + (myColor === 'black' ? 'guest' : 'host'); }

function publish(obj) {
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(myTopic(), JSON.stringify(obj));
  }
}

function connectMQTT() {
  if (mqttClient) { mqttClient.end(true); mqttClient = null; }
  if (brokerIdx < 0) brokerIdx = pickBroker(roomId);
  const broker = BROKERS[brokerIdx];
  setStatus('连接 ' + broker.name + '...', null);

  mqttClient = mqtt.connect(broker.url, {
    clientId: 'gomoku_' + Math.random().toString(36).slice(2, 10),
    clean: true, reconnectPeriod: 0,
    connectTimeout: 10000, keepalive: 30,
  });

  mqttClient.on('connect', () => {
    connectRetry = 0;
    setStatus('已连接 ' + broker.name, true);
    if (roomId) {
      mqttClient.subscribe(peerTopic());
      if (myColor === 'white') publish({ type: 'join' });
    }
  });

  mqttClient.on('message', (topic, payload) => {
    let data;
    try { data = JSON.parse(payload.toString()); } catch { return; }
    switch (data.type) {
      case 'move':
        placeStone(data.r, data.c, data.player);
        break;
      case 'undo_req':
        waitingUndoAnswer = true;
        document.getElementById('undoOverlay').classList.add('show');
        break;
      case 'undo_rsp':
        waitingUndoAnswer = false; handshakeDone = false; connectRetry = 0; brokerIdx = -1;
        if (data.accepted) { undoLocal(); setStatus('对方同意了悔棋', true); }
        else setStatus('对方拒绝了悔棋', false);
        break;
      case 'win':
        if (!gameOver) {
          gameOver = true;
          document.getElementById('winnerText').textContent = (myColor === 'black' ? '🎉 黑棋' : '🎉 白棋') + '获胜！';
          document.getElementById('winnerOverlay').classList.add('show');
          updateTurn();
        }
        break;
      case 'join':
        if (myColor === 'black') {
          publish({ type: 'join_ack' });
          handshakeDone = true;
          document.getElementById('waitingHint').style.display = 'none';
          setStatus('对手已加入，对局开始！', true);
        }
        break;
      case 'join_ack':
        if (myColor === 'white') {
          handshakeDone = true;
          setStatus('已加入房间，对局开始！', true);
        }
        break;
      case 'leave':
        if (!gameOver) {
          gameOver = true;
          document.getElementById('winnerText').textContent = '💨 对方离开了房间';
          document.getElementById('winnerOverlay').classList.add('show');
          updateTurn();
        }
        break;
    }
  });

  mqttClient.on('error', () => {
    connectRetry++;
    if (connectRetry >= 3) {
      connectRetry = 0;
      brokerIdx = (brokerIdx + 1) % BROKERS.length;
      setStatus('切换线路...', false);
    } else {
      setStatus('连接失败，重试中 (' + connectRetry + '/3)...', false);
    }
    setTimeout(() => { if (roomId && !handshakeDone) connectMQTT(); }, 2000);
  });

  mqttClient.on('close', () => {
    if (!roomId) return;
    if (handshakeDone) {
      connectRetry++;
      const delay = connectRetry <= 3 ? 1500 : 5000;
      if (connectRetry > 3) {
        brokerIdx = (brokerIdx + 1) % BROKERS.length;
        connectRetry = 0;
      }
      setStatus(connectRetry <= 3 ? '断线重连中... (' + connectRetry + '/3)' : '切换线路重连...', false);
      setTimeout(() => { if (roomId) connectMQTT(); }, delay);
    }
  });
}

function createRoom() {
  roomId = String(Math.floor(1000 + Math.random() * 9000));
  myColor = 'black';
  brokerIdx = -1; connectRetry = 0; handshakeDone = false;
  connectMQTT();
  document.getElementById('roomIdDisplay').textContent = roomId;
  document.getElementById('roomInfo').style.display = 'flex';
  document.getElementById('waitingHint').style.display = '';
  document.getElementById('statusText').textContent = '';
  setStatus('等待对手加入...', true);
  resetGame();
}

function joinRoom() {
  const rid = document.getElementById('roomInput').value.trim();
  if (rid.length !== 4) return setStatus('请输入4位房间号', false);
  roomId = rid;
  myColor = 'white';
  brokerIdx = -1; connectRetry = 0; handshakeDone = false;
  connectMQTT();
  document.getElementById('roomIdDisplay').textContent = roomId;
  document.getElementById('roomInfo').style.display = 'flex';
  document.getElementById('waitingHint').style.display = 'none';
  setStatus('加入房间中...', true);
  resetGame();
}

// ============ 复制邀请链接 ============
function copyLink() {
  const link = location.href.replace(location.search, '') + '?room=' + roomId;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = '✅ 链接已复制！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 复制邀请链接';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    prompt('复制以下链接分享给朋友:', link);
  });
}

// ============ 初始化 ============
function init() {
  drawBoard();
  updateTurn();
  const params = new URLSearchParams(location.search);
  const roomParam = params.get('room');
  if (roomParam) {
    switchMode('online');
    document.getElementById('roomInput').value = roomParam;
  }
}
init();
</script>
</body>
</html>
